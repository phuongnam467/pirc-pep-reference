[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piproof-sdk"
version = "0.19.0"
description = "Independent Python verifier for the PiProof protocol (standard library only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["piproof", "ed25519", "canonical-json", "agent-identity", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.scripts]
piproof-verify = "piproof_sdk:main"

[tool.setuptools]
py-modules = ["piproof_sdk"]
