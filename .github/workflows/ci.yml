name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # supply-chain hardening: every third-party action pinned to a full SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: unit + integration tests
        run: npm test
      - name: layer governance (L0…L4 import rules)
        run: npm run layers
      - name: adversarial attack suite
        run: npm run attacks
      - name: fuzzing suite (quick mode, seeded)
        run: npm run fuzz:quick
      - name: regenerate and re-verify test vectors
        run: npm run gen:vectors
      - name: vectors are byte-for-byte reproducible
        shell: bash
        run: |
          git diff --exit-code --stat -- vectors/
          if [ -n "$(git status --porcelain -- vectors/)" ]; then
            echo "::error::regenerated vectors differ from committed ones"; git diff -- vectors/; exit 1
          fi
          echo "byte-for-byte vector reproducibility confirmed"
      - name: zero runtime dependencies policy
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const d=Object.keys(p.dependencies||{}); if(d.length>0){console.error('runtime dependencies are forbidden:',d.join(', '));process.exit(1)}; console.log('zero runtime dependencies confirmed')"

  cross-verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: generate vectors with Node
        run: npm run gen:vectors
      - name: independent Python verifier (RFC 8032 Ed25519, stdlib only)
        run: python scripts/cross-verify.py
      - name: independent Python canonicalizer (PiProof Canonical Profile v1.1, stdlib only)
        run: python scripts/cross-canonical.py
      - name: differential fuzzing vs Node (seeded, quick mode)
        run: node scripts/fuzz.mjs --quick --only=cross-lang-diff,parser-differential

  conformance-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: Go protocol core — conformance matrix (vectors + attacks)
        run: go test ./...
        working-directory: sdk/go
      - name: go vet
        run: go vet ./...
        working-directory: sdk/go

  python-package:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: installable package (pip install)
        run: pip install ./sdk/python
      - name: conformance — public vectors + end-to-end + negatives
        run: python sdk/python/test_sdk.py
      - name: console script exists
        shell: bash
        run: piproof-verify --help > /dev/null && echo "console script OK"

  rust-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain (rustup preinstalled on hosted runners)
        shell: bash
        run: |
          rustup --version
          rustc --version
          cargo --version
      - name: cargo test — canonical vectors + end-to-end pipeline
        run: cargo test
        working-directory: sdk/rust

  wasm-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: build Go → WASM
        shell: bash
        run: |
          cd wasm
          GOOS=js GOARCH=wasm go build -o piproof.wasm .
      - name: smoke — accept / replay-burn / tamper in Node
        shell: bash
        run: node wasm/smoke.mjs "$(go env GOROOT)"

  formal-tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: download tla2tools (checksum-pinned, matches official release SHA1)
        shell: bash
        run: |
          curl -fsSL --retry 3 -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  tla2tools.jar" | sha1sum -c -
      - name: model-check the G1–G9 stateful core (INV-04 / INV-05)
        shell: bash
        run: |
          cd formal
          java -XX:+UseParallelGC -jar ../tla2tools.jar -config piproof_gates.cfg piproof_gates.tla | tee tlc-output.txt
          grep -q "No error has been found" tlc-output.txt || { echo "::error::TLC reported errors"; exit 1; }
