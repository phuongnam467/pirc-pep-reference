<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public Verification · AUREVIA</title>
<meta name="description" content="Independently verify an AUREVIA Proof Passport — no account, no trust in the issuing app.">
<style>
  :root{--bg:#070c16;--ink:#eef3fb;--dim:#93a0ba;--line:rgba(148,170,220,.16);
        --glass:rgba(148,170,220,.06);--gold:#f5c451;--green:#3ddc97;--red:#ff6d7e}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:
    radial-gradient(1200px 700px at 80% -10%,#101a30 0%,var(--bg) 60%);
    color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 18px}
  .brand{font-size:26px;font-weight:800;letter-spacing:.22em;
    background:linear-gradient(90deg,#f5c451,#3ddc97);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:13px;margin-top:6px;text-align:center}
  h1{font-size:17px;font-weight:600;margin:26px 0 18px;text-align:center;line-height:1.6}
  code{color:#f5c451;font-family:ui-monospace,monospace;font-size:.95em}
  #verdict{font-weight:900;font-size:clamp(24px,6vw,42px);letter-spacing:.08em;text-align:center;
    padding:20px 34px;border-radius:18px;border:1px solid var(--line);background:var(--glass);margin-bottom:22px}
  #verdict.valid{color:#08130c;background:linear-gradient(90deg,var(--green),#7fe9bd);border-color:transparent}
  #verdict.invalid{color:#fff;background:linear-gradient(90deg,#c0344b,var(--red));border-color:transparent}
  #verdict.unverifiable{color:var(--gold)}
  table{border-collapse:collapse;width:100%;max-width:720px;font-size:14px}
  td{padding:11px 14px;border-bottom:1px solid var(--line)}
  td.q{color:var(--dim);font-weight:700;white-space:nowrap}
  td.s{text-align:right;font-weight:900;letter-spacing:.05em}
  td.s.OK{color:var(--green)} td.s.INVALID{color:var(--red)} td.s.UNVERIFIABLE{color:var(--gold)}
  .note{max-width:720px;color:var(--dim);font-size:12.5px;line-height:1.8;margin-top:26px;text-align:center}
  a{color:#9fd8ff}
  .mono{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--dim);word-break:break-all}
</style>
</head>
<body>
<div class="brand">AUREVIA</div>
<div class="sub">Proofs you can carry. Evidence anyone can verify.</div>
<h1 id="headline">Public verification — no account, no trust in the issuing app.</h1>
<div id="verdict">READING DOCUMENT…</div>
<table id="chain" hidden></table>
<p class="note" id="note"></p>
<script>
(function(){
  const m=(location.hash||location.search).match(/[?#&]p=([A-Za-z0-9_-]+)/);
  const V=document.getElementById('verdict'),C=document.getElementById('chain'),N=document.getElementById('note');
  if(!m){V.textContent='NO DOCUMENT IN LINK';V.className='unverifiable';
    N.innerHTML='Open a verification link of the form <code>…/verify#p=&lt;document&gt;</code>, '+
      'or paste a passport via the dashboard’s share button.';return;}
  let doc;
  try{
    const b=m[1].replace(/-/g,'+').replace(/_/g,'/');
    doc=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b+'='.repeat((4-b.length%4)%4)),c=>c.charCodeAt(0))));
  }catch(e){V.textContent='UNREADABLE LINK';N.textContent='The embedded document could not be decoded.';return;}
  if(!doc||typeof doc!=='object'||(doc.type!=='PiProof'&&doc.type!=='AUREVIA-Evidence-Passport')){
    V.textContent='UNSUPPORTED DOCUMENT';V.className='invalid';return;}
  const isPassport=doc.type==='AUREVIA-Evidence-Passport';
  fetch(isPassport?'api/verify-passport':'api/verify-proof',{
    method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify(isPassport?{passport:doc}:{proof:doc})
  }).then(r=>r.json()).then(j=>{
    render(j,isPassport,doc);
  }).catch(()=>{
    staticRender(doc,isPassport);
  });

  function row(q,status,answer){
    return `<tr><td class="q">${q}</td><td>${answer}</td><td class="s ${status}">${status}</td></tr>`;
  }
  function render(r,isPassport){
    const steps=r.steps||[];
    const by=id=>steps.find(s=>s.id===id);
    C.hidden=false;
    if(isPassport&&r.summary){
      C.innerHTML+=row('DOCUMENT','OK',`${r.summary.proofs_valid}/${r.summary.proofs_total} proof(s) valid`);
    }
    for(const s of steps){
      const q=s.label||s.id;
      C.innerHTML+=row(q[0].toUpperCase()+q.slice(1),s.pass?'OK':'INVALID',
        s.detail?`<span class="mono">${String(s.detail).slice(0,72)}</span>`:'—');
    }
    if(r.ok){V.textContent='PROOF VERIFIED ✓';V.className='valid';}
    else{V.textContent='INVALID ✗';V.className='invalid';
      N.textContent='At least one layer definitively failed against this verifier’s own trusted state.';}
  }
  function staticRender(doc,isPassport){
    C.hidden=false;
    const ev=isPassport?(doc.proofs||[{}])[0]:doc;
    const e=ev.event||{};
    C.innerHTML=
      row('ISSUER (self-declared)','UNVERIFIABLE',e.app_id||'—')+
      row('ACTION','UNVERIFIABLE',`${e.action_class??'—'} · ${e.action_id??'—'} · weight ${e.weight??'—'}`)+
      row('SUBJECT','UNVERIFIABLE',doc.subject||'pseudonymous hash only')+
      row('EVIDENCE ROOT','UNVERIFIABLE',isPassport?`<span class="mono">${String(doc.evidence_root).slice(0,26)}…</span>`:'n/a')+
      row('SIGNATURE & EPOCH CHECKS','UNVERIFIABLE','need the Node verifier’s registry epoch');
    V.textContent='STRUCTURAL VIEW ONLY';V.className='unverifiable';
    N.innerHTML='This static deployment cannot execute the verifier. '+
      'Run the exact pipeline yourself:<br><code>pep '+(isPassport?'passport-verify --passport passport.json':'proof-verify --proof proof.json')+' --registry registry.json</code>';
  }
})();
</script>
</body>
</html>
